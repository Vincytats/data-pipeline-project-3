name: Monthly Stats Pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 6AM
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas

      - name: Run pipeline
        run: python pipeline.py

      - name: Commit updated dataset
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add processed_monthly_stats.csv
          git commit -m "Auto-update processed dataset" || echo "No changes"
          git push
